# configs/dev.yaml
# Development configuration – runs on any machine without Pi hardware.
# Hardware components (GPIO, LCD, audio) degrade gracefully to console stubs.
# STT/TTS operations are skipped in demo mode (text input/output only).

app:
  name: "Crisis Assistant (DEV)"
  version: "2.0"
  prompt_style: "warm"

hardware:
  button_pin: 17
  lcd_type: "i2c"
  lcd_address: 0x27
  lcd_cols: 16
  lcd_rows: 2

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  mic_device: null
  speaker_device: null

whisper:
  # Set these to real paths to enable STT in dev
  model_path: "models/whisper/ggml-tiny.en.bin"
  binary_path: "models/whisper/whisper-cpp/main"
  language: "en"

piper:
  # Set these to real paths to enable TTS in dev
  model_path: "models/piper/en_US-amy-medium.onnx"
  binary_path: "models/piper/piper/build/piper"

llm:
  model_path: "models/llm/Phi-3-mini-4k-instruct-q4.gguf"
  n_ctx: 4096
  n_threads: 4
  n_gpu_layers: 0
  temperature: 0.7
  max_tokens: 150

rag:
  index_path: "data/index"
  embedding_model: "BAAI/bge-small-en-v1.5"
  top_k: 3

decision:
  tree_dir: "decision_trees"

logging:
  level: "DEBUG"
  file: "logs/crisis_assistant_dev.log"
