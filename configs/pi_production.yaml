# configs/pi_production.yaml
# Production configuration for Raspberry Pi 5 deployment

app:
  name: "Crisis Assistant"
  version: "2.0"
  prompt_style: "warm"

hardware:
  button_pin: 16
  lcd_type: "i2c"
  lcd_address: 0x27
  lcd_cols: 16
  lcd_rows: 2

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  mic_device: null       # null = auto-detect first USB mic
  speaker_device: null   # null = default ALSA output

whisper:
  model_path: "/home/joshua/crisis-assistant/models/whisper/ggml-tiny.en.bin"
  binary_path: "/home/joshua/crisis-assistant/models/whisper/whisper-cpp/build/bin/whisper-cli"
  language: "en"

piper:
  model_path: "/home/joshua/crisis-assistant/models/piper/en_US-amy-medium.onnx"
  binary_path: "/home/joshua/crisis-assistant/models/piper/piper/build/piper"

llm:
  model_path: "/home/joshua/crisis-assistant/models/llm/Phi-3-mini-4k-instruct-q4.gguf"
  n_ctx: 4096
  n_threads: 4           # Pi 5 has 4 cores; use all for inference
  n_gpu_layers: 0        # CPU-only; set >0 if you add a GPU accelerator
  temperature: 0.7
  max_tokens: 150

rag:
  index_path: "/home/joshua/crisis-assistant/data/index"
  embedding_model: "BAAI/bge-small-en-v1.5"
  model_path: "/home/joshua/crisis-assistant/models/embeddings/bge-small-en-v1.5"
  local_files_only: true
  top_k: 3

decision:
  tree_dir: "/home/joshua/crisis-assistant/decision_trees"

logging:
  level: "INFO"
  file: "/home/joshua/crisis-assistant/logs/crisis_assistant.log"

gpio:
  enabled: true
  button_pin: 16
  button_active_low: true
  button_pull_up: true
