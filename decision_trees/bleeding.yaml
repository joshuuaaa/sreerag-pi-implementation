# decision_trees/bleeding.yaml

tree_id: "bleeding_protocol"
version: "2.0"
description: "Bleeding emergency protocol"

nodes:
  root:
    id: "root"
    type: "question"
    question: "Is the person conscious and responsive?"
    options:
      - response_match: ["yes", "conscious", "awake", "responsive", "alert"]
        next: "assess_severity"
      - response_match: ["no", "unconscious", "not responsive", "passed out"]
        next: "escalate_unconscious"

  # ── Open fracture complication branch ────────────────────────────────────
  # Reached when the decision engine detects fracture as a secondary condition.
  open_fracture_bleeding:
    id: "open_fracture_bleeding"
    type: "instruction"
    instruction: "OPEN FRACTURE WITH BLEEDING — do NOT press directly on the bone or any protruding tissue. Apply gentle pressure with a clean cloth around the wound edges only, not over the bone. Cover the wound loosely — do NOT push the bone back in. Keep the limb completely still and supported in the position found."
    rag_tags: ["fracture", "open_fracture", "bleeding", "wound_care"]
    next: "fracture_bleed_check"
    critical: true

  fracture_bleed_check:
    id: "fracture_bleed_check"
    type: "question"
    question: "Is the bleeding slowing with gentle pressure around the wound edges?"
    options:
      - response_match: ["yes", "slowing", "less", "stopping", "controlled", "better"]
        next: "fracture_bleed_stable"
      - response_match: ["no", "still bleeding", "heavy", "worse", "not stopping"]
        next: "escalate_severe"

  fracture_bleed_stable:
    id: "fracture_bleed_stable"
    type: "instruction"
    instruction: "Good. Maintain gentle pressure around — not on — the wound. Keep the limb still. Watch for signs of shock: pale skin, rapid breathing, confusion, cold clammy skin."
    rag_tags: ["fracture", "shock_prevention"]
    terminal: true

  # ── Chest wound complication branch ────────────────────────────────────
  # Reached when decision engine detects chest_injury as secondary condition.
  chest_wound_bleeding:
    id: "chest_wound_bleeding"
    type: "instruction"
    instruction: "CHEST WOUND WITH BLEEDING — Do NOT seal tightly with direct pressure. Cover the wound with any non-porous material (plastic, foil, clean packaging). Tape THREE sides only — leave the bottom edge open so air can escape. This prevents tension pneumothorax. Monitor breathing closely."
    rag_tags: ["chest_injury", "bleeding", "wound_care", "pneumothorax"]
    next: "chest_wound_check"
    critical: true

  chest_wound_check:
    id: "chest_wound_check"
    type: "question"
    question: "After covering, is breathing getting WORSE — more difficulty, skin turning blue, or neck veins becoming visible?"
    options:
      - response_match: ["yes", "worse", "blue", "harder", "struggling", "can't breathe"]
        next: "lift_seal"
      - response_match: ["no", "same", "better", "okay", "stable", "improving"]
        next: "chest_wound_stable"

  lift_seal:
    id: "lift_seal"
    type: "escalate"
    message: "TENSION PNEUMOTHORAX RISK. Lift the unsealed edge of the covering immediately to release trapped air. Keep lifting and re-sealing in short bursts. This is life-threatening — send for any available help now and do not leave the person."
    critical: true

  chest_wound_stable:
    id: "chest_wound_stable"
    type: "instruction"
    instruction: "Good. Keep the 3-sided seal in place. Sit the person upright or slightly leaning toward the injured side. Check breathing every 2 minutes. Watch for the seal lifting in or out with breaths."
    rag_tags: ["chest_injury", "monitoring"]
    terminal: true
        
  assess_severity:
    id: "assess_severity"
    type: "question"
    question: "How severe is the bleeding? Is it spurting, flowing steadily, or just oozing?"
    options:
      - response_match: ["spurting", "severe", "lots", "won't stop", "heavy", "gushing"]
        next: "severe_bleeding"
      - response_match: ["steady", "moderate", "flowing", "medium"]
        next: "moderate_bleeding"
      - response_match: ["light", "minor", "oozing", "small", "little"]
        next: "minor_bleeding"
        
  severe_bleeding:
    id: "severe_bleeding"
    type: "instruction"
    instruction: "Apply FIRM, DIRECT pressure with a clean cloth immediately. Do not remove it even if blood soaks through."
    rag_tags: ["severe_bleeding", "pressure_application", "shock_prevention"]
    next: "check_pressure"
    critical: true
    
  check_pressure:
    id: "check_pressure"
    type: "question"
    question: "Are you applying firm pressure now? Tell me when it's in place."
    options:
      - response_match: ["yes", "done", "doing it", "applying", "pressing"]
        next: "monitor_bleeding"
      - response_match: ["no", "can't", "nothing to use"]
        next: "find_materials"
        
  monitor_bleeding:
    id: "monitor_bleeding"
    type: "instruction"
    instruction: "Good. Keep steady pressure for at least 10 minutes without checking. If blood soaks through, add another cloth on top. Do NOT remove the first one."
    next: "check_slowing"
    
  check_slowing:
    id: "check_slowing"
    type: "question"
    question: "After a few minutes, is the bleeding slowing down at all?"
    options:
      - response_match: ["yes", "slowing", "better", "less"]
        next: "continue_pressure"
      - response_match: ["no", "still bad", "not stopping", "worse"]
        next: "escalate_severe"
        
  moderate_bleeding:
    id: "moderate_bleeding"
    type: "instruction"
    instruction: "Apply steady pressure with a clean cloth. Elevate the injured area above the heart if possible."
    rag_tags: ["moderate_bleeding", "elevation"]
    next: "moderate_monitor"
    
  minor_bleeding:
    id: "minor_bleeding"
    type: "instruction"
    instruction: "Clean the wound gently with clean water, apply pressure with a clean cloth, then bandage once bleeding stops."
    rag_tags: ["minor_bleeding", "wound_care"]
    next: "wound_care"
    
  escalate_unconscious:
    id: "escalate_unconscious"
    type: "escalate"
    message: "⚠️ UNCONSCIOUS PERSON. Send someone for help immediately if possible. Check their breathing NOW — tilt head back, look, listen, feel for 10 seconds. If not breathing, start CPR. Tell me what you find."
    critical: true
    
  escalate_severe:
    id: "escalate_severe"
    type: "escalate"
    message: "⚠️ LIFE-THREATENING BLEED. Do NOT remove your hands. If blood soaks through, press harder — add more material on top. If you have a belt, tie it tightly 2–3 inches above the wound as a tourniquet. Send someone for any available help. Do NOT stop pressure."
    critical: true
    
  find_materials:
    id: "find_materials"
    type: "instruction"
    instruction: "Use any clean cloth - towel, shirt, scarf. If nothing is available, use your bare hands. Apply firm pressure directly on the wound."
    next: "check_pressure"
    
  continue_pressure:
    id: "continue_pressure"
    type: "instruction"
    instruction: "Excellent. Continue pressure until bleeding fully stops or help arrives. Keep the person warm and calm."
    terminal: true
    
  moderate_monitor:
    id: "moderate_monitor"
    type: "question"
    question: "Is the bleeding under control now?"
    options:
      - response_match: ["yes", "stopped", "under control"]
        next: "bandage_wound"
      - response_match: ["no", "still bleeding"]
        next: "increase_pressure"
        
  wound_care:
    id: "wound_care"
    type: "instruction"
    instruction: "Once bleeding stops, apply antibiotic ointment if available and cover with a clean bandage. Watch for signs of infection."
    terminal: true
    
  bandage_wound:
    id: "bandage_wound"
    type: "instruction"
    instruction: "Apply a bandage firmly but not too tight. Keep the area elevated and watch for swelling or renewed bleeding."
    terminal: true
    
  increase_pressure:
    id: "increase_pressure"
    type: "instruction"
    instruction: "Press harder and add another cloth layer on top — do NOT lift the first one. If bleeding continues after 10 minutes of firm pressure, improvise a tourniquet: tie fabric tightly 2–3 inches above the wound and twist until bleeding slows."
    next: "moderate_monitor"

